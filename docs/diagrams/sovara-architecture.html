<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOVARA Phase-1 Architecture — Sovereign AI Workbench</title>
  <!-- SOVARA profile (sovara): offline sovereign build — no remote fonts. System stacks only. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1a2e;
      --color-paper-2: #2a2a4a;
      --color-panel:   #222240;
      --color-ink:     #e8e8f0;
      --color-muted:   #9a9ab0;
      --color-soft:    #6e6e8a;
      --color-accent:  #6ba3e0;
      --color-link:    #5b93d6;
      --font-sans:     system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SOVARA · Diagram Design</p>
    <h1>SOVARA Phase-1 Architecture</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sovara-architecture-title sovara-architecture-desc">
      <title id="sovara-architecture-title">SOVARA Phase-1 Architecture</title>
      <desc id="sovara-architecture-desc">Architecture diagram showing the Next.js UI calling a validated API into the focal AppBackend, which persists to local SQLite plus JSONL and serves local loopback runtimes, while cloud and telemetry paths are blocked at the loopback trust boundary.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a9ab0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6ba3e0"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1a1a2e"/>

      <!-- Zone: loopback trust boundary (painted first) -->
      <rect x="20" y="96" width="704" height="392" rx="8"
            fill="rgba(232,232,240,0.02)" stroke="rgba(232,232,240,0.10)" stroke-width="0.8"/>
      <rect x="36" y="100" width="120" height="12" rx="2" fill="#1a1a2e"/>
      <text x="96" y="109" fill="rgba(232,232,240,0.40)" font-size="7"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">LOOPBACK ONLY</text>

      <!-- Arrows (before nodes) -->
      <!-- C1 UI -> /api -->
      <line x1="188" y1="232" x2="228" y2="232" stroke="#9a9ab0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="190" y="212" width="36" height="12" rx="2" fill="#1a1a2e"/>
      <text x="208" y="221" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">INVOKE</text>
      <!-- C2 /api -> AppBackend -->
      <line x1="368" y1="232" x2="408" y2="232" stroke="#9a9ab0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="370" y="212" width="36" height="12" rx="2" fill="#1a1a2e"/>
      <text x="388" y="221" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>
      <!-- C3 AppBackend -> Adapters (vertical) -->
      <line x1="488" y1="272" x2="488" y2="360" stroke="#6ba3e0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="496" y="310" width="36" height="12" rx="2" fill="#1a1a2e"/>
      <text x="514" y="319" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>
      <!-- C4 Adapters -> Runtimes -->
      <line x1="568" y1="392" x2="608" y2="392" stroke="#9a9ab0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="570" y="372" width="36" height="12" rx="2" fill="#1a1a2e"/>
      <text x="588" y="381" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SERVE</text>
      <!-- C5 /api -> Store (vertical) -->
      <line x1="298" y1="264" x2="298" y2="360" stroke="#9a9ab0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="306" y="302" width="40" height="12" rx="2" fill="#1a1a2e"/>
      <text x="326" y="311" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
      <!-- C6 forbidden: cloud -> boundary (dashed, stops at zone edge) -->
      <line x1="768" y1="232" x2="728" y2="232" stroke="#9a9ab0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="744" y="236" fill="#9a9ab0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">×</text>
      <rect x="726" y="212" width="40" height="12" rx="2" fill="#1a1a2e"/>
      <text x="746" y="221" fill="#6e6e8a" font-size="8"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">DENIED</text>

      <!-- Nodes -->
      <!-- UI -->
      <rect x="48" y="200" width="140" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="48" y="200" width="140" height="64" rx="6" fill="#222240" stroke="#e8e8f0" stroke-width="1"/>
      <rect x="56" y="206" width="44" height="12" rx="2" fill="transparent" stroke="rgba(232,232,240,0.40)" stroke-width="0.8"/>
      <text x="78" y="215" fill="rgba(232,232,240,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="118" y="238" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Next.js UI</text>
      <text x="118" y="254" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">no fs · no db</text>
      <!-- /api -->
      <rect x="228" y="200" width="140" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="228" y="200" width="140" height="64" rx="6" fill="#222240" stroke="#e8e8f0" stroke-width="1"/>
      <rect x="236" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(232,232,240,0.40)" stroke-width="0.8"/>
      <text x="250" y="215" fill="rgba(232,232,240,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="298" y="238" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">/api</text>
      <text x="298" y="254" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Zod-validated</text>
      <!-- AppBackend (focal) -->
      <rect x="408" y="192" width="160" height="80" rx="6" fill="#1a1a2e"/>
      <rect x="408" y="192" width="160" height="80" rx="6" fill="rgba(107,163,224,0.10)" stroke="#6ba3e0" stroke-width="1"/>
      <rect x="416" y="198" width="32" height="12" rx="2" fill="transparent" stroke="rgba(107,163,224,0.60)" stroke-width="0.8"/>
      <text x="432" y="207" fill="#6ba3e0" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="488" y="234" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">AppBackend</text>
      <text x="488" y="252" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">composition root</text>
      <!-- Store -->
      <rect x="228" y="360" width="140" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="228" y="360" width="140" height="64" rx="6" fill="rgba(232,232,240,0.05)" stroke="#9a9ab0" stroke-width="1"/>
      <rect x="236" y="366" width="36" height="12" rx="2" fill="transparent" stroke="rgba(154,154,176,0.60)" stroke-width="0.8"/>
      <text x="254" y="375" fill="#9a9ab0" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="298" y="398" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SQLite + JSONL</text>
      <text x="298" y="414" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">events.v1.jsonl</text>
      <!-- Adapters -->
      <rect x="408" y="360" width="160" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="408" y="360" width="160" height="64" rx="6" fill="#222240" stroke="#e8e8f0" stroke-width="1"/>
      <rect x="416" y="366" width="52" height="12" rx="2" fill="transparent" stroke="rgba(232,232,240,0.40)" stroke-width="0.8"/>
      <text x="442" y="375" fill="rgba(232,232,240,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">ADAPTER</text>
      <text x="488" y="398" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Ports + Adapters</text>
      <text x="488" y="414" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">loopback HttpClient</text>
      <!-- Runtimes -->
      <rect x="608" y="360" width="160" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="608" y="360" width="160" height="64" rx="6" fill="#222240" stroke="#e8e8f0" stroke-width="1"/>
      <rect x="616" y="366" width="52" height="12" rx="2" fill="transparent" stroke="rgba(232,232,240,0.40)" stroke-width="0.8"/>
      <text x="642" y="375" fill="rgba(232,232,240,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
      <text x="688" y="398" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Local runtimes</text>
      <text x="688" y="414" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Ollama · llama.cpp</text>
      <!-- Cloud (external, outside zone) -->
      <rect x="768" y="200" width="144" height="64" rx="6" fill="#1a1a2e"/>
      <rect x="768" y="200" width="144" height="64" rx="6" fill="rgba(232,232,240,0.03)" stroke="rgba(232,232,240,0.30)" stroke-width="1"/>
      <rect x="776" y="206" width="56" height="12" rx="2" fill="transparent" stroke="rgba(232,232,240,0.40)" stroke-width="0.8"/>
      <text x="804" y="215" fill="rgba(232,232,240,0.80)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="840" y="238" fill="#e8e8f0" font-size="12" font-weight="600"
            font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Cloud / telemetry</text>
      <text x="840" y="254" fill="#9a9ab0" font-size="9"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">forbidden</text>

      <!-- Legend -->
      <line x1="30" y1="524" x2="930" y2="524" stroke="rgba(232,232,240,0.12)" stroke-width="0.8"/>
      <text x="30" y="542" fill="#9a9ab0" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            letter-spacing="0.14em">LEGEND</text>
      <circle cx="120" cy="556" r="4" fill="rgba(107,163,224,0.10)" stroke="#6ba3e0" stroke-width="1"/>
      <text x="130" y="559" fill="#9a9ab0" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">focal: AppBackend</text>
      <rect x="280" y="551" width="10" height="10" fill="rgba(232,232,240,0.05)" stroke="#9a9ab0" stroke-width="1"/>
      <text x="294" y="559" fill="#9a9ab0" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">local store</text>
      <line x1="420" y1="556" x2="452" y2="556" stroke="#9a9ab0" stroke-width="1.2"/>
      <text x="456" y="559" fill="#9a9ab0" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">permitted call</text>
      <line x1="590" y1="556" x2="622" y2="556" stroke="#9a9ab0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="626" y="559" fill="#9a9ab0" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">blocked path</text>

    </svg>
  </div>
</body>
</html>
