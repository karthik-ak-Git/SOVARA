<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sovara desktop architecture</title>
  <desc id="desc">React renderer through preload and validated IPC to the TypeScript Electron main process and local model runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:16; }
      .main { fill:#e0f2fe; stroke:#0284c7; }
      .local { fill:#ecfdf5; stroke:#059669; }
      .text { font: 600 20px Manrope, sans-serif; fill:#0f172a; }
      .small { font: 14px Manrope, sans-serif; fill:#475569; }
      .edge { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="40" y="40" width="1120" height="620" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="24"/>
  <text x="70" y="85" class="text" font-size="28">Sovara desktop-only architecture</text>
  <text x="70" y="112" class="small">No hosted web app · no Python sidecars · light-only renderer</text>

  <rect x="90" y="180" width="250" height="250" class="box"/>
  <text x="130" y="225" class="text">React renderer</text>
  <text x="130" y="260" class="small">Chat</text>
  <text x="130" y="290" class="small">Models and library</text>
  <text x="130" y="320" class="small">Settings and context</text>
  <text x="130" y="350" class="small">Light design tokens</text>
  <text x="130" y="390" class="small">View models only</text>

  <rect x="475" y="180" width="250" height="250" class="box main"/>
  <text x="520" y="225" class="text">Electron main</text>
  <text x="520" y="260" class="small">Zod-validated IPC</text>
  <text x="520" y="290" class="small">AppBackend</text>
  <text x="520" y="320" class="small">SQLite + JSONL</text>
  <text x="520" y="350" class="small">Tools and permissions</text>
  <text x="520" y="390" class="small">Settings and hardware</text>

  <rect x="860" y="180" width="250" height="250" class="box local"/>
  <text x="905" y="225" class="text">Local inference</text>
  <text x="905" y="260" class="small">llama.cpp runtime</text>
  <text x="905" y="290" class="small">GPU/CPU placement</text>
  <text x="905" y="320" class="small">Loopback health check</text>
  <text x="905" y="350" class="small">GGUF model library</text>
  <text x="905" y="390" class="small">Verified readiness</text>

  <path d="M340 305 H475" class="edge"/>
  <path d="M725 305 H860" class="edge"/>
  <text x="355" y="290" class="small">invoke</text>
  <text x="750" y="290" class="small">OpenAI-compatible loopback</text>

  <rect x="190" y="515" width="820" height="90" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="240" y="555" class="text">Trust boundary</text>
  <text x="240" y="585" class="small">Preload allowlist · context isolation · no raw ipcRenderer · explicit external web access</text>
</svg>
