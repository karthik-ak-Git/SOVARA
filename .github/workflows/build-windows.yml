name: Build Windows (.exe)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # prevent postinstall llama download from crashing gate
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
      - run: pnpm --filter @sovara/desktop typecheck
      - run: pnpm --filter @sovara/desktop exec vitest run tests/attachments.artifacts.test.ts tests/chat.inference.test.ts tests/ipc.validation.test.ts tests/agent.orchestrator.test.ts --reporter=verbose

  build-windows:
    name: Build .exe (x64)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (with retry, llama non-fatal)
        shell: pwsh
        run: |
          $attempt=0
          do {
            $attempt++
            Write-Host "Install attempt $attempt ..."
            # skip llama download on first pass — do it explicitly as non-fatal
            $env:NODE_LLAMA_CPP_SKIP_DOWNLOAD="true"
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 10
          } while ($true)
          # best-effort llama binaries — do not fail the job if CDN unreachable
          pnpm --filter @sovara/desktop exec node-llama-cpp download --gpu cuda --arch x64 2>&1 | Out-String -Stream | Write-Host
          Write-Host "llama download exit: $LASTEXITCODE (non-fatal)"

      - name: Typecheck
        run: pnpm --filter @sovara/desktop typecheck

      - name: Unit tests (packaging-relevant)
        run: pnpm --filter @sovara/desktop exec vitest run tests/attachments.artifacts.test.ts tests/chat.inference.test.ts tests/ipc.validation.test.ts tests/agent.orchestrator.test.ts --reporter=verbose

      - name: Build Windows installer (.exe)
        run: pnpm --filter @sovara/desktop build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List installer output
        if: always()
        run: |
          Write-Host "=== dist ==="
          Get-ChildItem -LiteralPath apps/desktop/dist -Recurse | Select-Object Name,Length,FullName | Format-Table -AutoSize
          if (-not (Test-Path "apps/desktop/dist/*.exe")) { Write-Warning "No .exe found — build likely failed (see logs above)"; Get-ChildItem -LiteralPath apps/desktop -Recurse -Filter "*.log" | Select-Object FullName -First 20 }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sovara-Windows-x64
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            apps/desktop/dist/**/*.log
            apps/desktop/out/**/*
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Sovara-Windows-x64
          path: dist

      - name: Generate release notes (with Known Issue section)
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "TAG=$TAG PREV=$PREV"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Sovara $TAG"
            echo ""
            echo "### Artifacts"
            echo "- \`Sovara-Setup-\${TAG#v}-x64.exe\` — Windows x64 NSIS installer (unsigned, SmartScreen will prompt)."
            echo ""
            echo "### Known Issue (tracked)"
            echo "> **Cloud .exe build was crashing in CI** — mitigated in this release by hardening the workflow:"
            echo "> retry-wrapped install, non-fatal \`node-llama-cpp\` download, concurrency cancel, timeouts, and failure-log artifacts."
            echo "> If the .exe is missing from this Release, check the **Actions → Build Windows** run for \`build-failure-logs\`."
            echo ""
            echo "### Changes since $PREV"
            echo ""
            git log $RANGE --pretty=format:"- %s (%h)" --no-merges | head -n 100
            echo ""
            echo ""
            echo "---"
            echo "_Full changelog: https://github.com/${{ github.repository }}/compare/$PREV...$TAG_"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # electron-updater cannot install anything without `latest.yml`, and it
          # uses the `.blockmap` for differential downloads. Uploading only the
          # .exe left the in-app "Update Now" flow permanently stuck at
          # "available" even though detection worked.
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
