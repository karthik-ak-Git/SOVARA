name: sovara

# Phase 0 local foundation: backend API + frontend UI.
# No model runtimes, vector stores, or object storage yet.
# Those plug in later as additional services on `sovara-net`.
# All images are local/self-hosted; no cloud AI services.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: sovara/backend:phase0
    env_file:
      - ./backend/.env.example
    environment:
      SOVARA_ENV: ${SOVARA_ENV:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - sovara-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: sovara/frontend:phase0
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sovara-net
    restart: unless-stopped

networks:
  sovara-net:
    driver: bridge
