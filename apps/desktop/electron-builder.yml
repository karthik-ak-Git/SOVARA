appId: com.sovara.desktop
productName: Sovara
copyright: Copyright © 2026 Sovara

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: python
    to: python

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  publisherName: Sovara
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sovara

publish: null
