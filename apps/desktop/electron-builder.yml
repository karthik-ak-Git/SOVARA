appId: com.sovara.desktop
productName: Sovara
copyright: Copyright © 2026 Sovara

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: python
    to: python
  # Internal Next.js server (UI + /api), staged by scripts/stage-web-runtime.ps1.
  # Unpacked (outside asar) so node can execute it; resolved in nextServer.ts.
  - from: web-runtime
    to: web-runtime
    filter:
      - package.json
      - next.config.mjs
      - .next/**/*
      - node_modules/**/*
      - '!node_modules/.bin{,/**/*}'
      - '!node_modules/typescript{,/**/*}'
      - '!**/*.map'

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  publisherName: Sovara
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sovara

publish: null
