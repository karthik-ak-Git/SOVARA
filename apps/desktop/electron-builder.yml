appId: com.sovara.desktop
productName: Sovara
copyright: Copyright © 2026 Sovara

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  # node-llama-cpp prebuilt binaries — bundled like Ollama, no Toolkit needed at runtime
  - from: node_modules/node-llama-cpp/llama
    to: llama
    filter:
      - localBuilds/**/*
      - dist/**/*
  - from: node_modules/node-llama-cpp/bins
    to: bins
  - from: python
    to: python

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  publisherName: Sovara
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sovara

publish: null
