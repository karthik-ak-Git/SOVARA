appId: com.sovara.desktop
productName: Sovara
copyright: Copyright © 2026 Sovara

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  # node-pty ships Python build/debug helpers that are not runtime dependencies.
  - '!node_modules/node-pty/**/*.py'
  - '!node_modules/node-pty/deps/**/*.py'

extraResources:
  # Pinned llama.cpp CUDA runtime staged by scripts/prepare-package-runtime.mjs
  - from: resources/runtime
    to: llama-runtime
    filter:
      - "**/*"
  # node-llama-cpp prebuilt binaries — bundled like Ollama, no Toolkit needed at runtime
  - from: node_modules/node-llama-cpp/llama
    to: llama
    filter:
      - localBuilds/**/*
      - dist/**/*
  - from: node_modules/node-llama-cpp/bins
    to: bins
  # node-pty Electron-ABI binaries (ConPTY) — vendored: upstream publishes no
  # Electron prebuilds for v35, so build/Release holds locally built binaries.
  # ptyHost loads these from <resources>/pty when node_modules is unavailable.
  - from: resources/pty
    to: pty

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  publisherName: Sovara
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sovara

artifactName: Sovara-Setup-${version}-${arch}.${ext}

publish:
  provider: github
  owner: karthik-ak-Git
  repo: SOVARA
  releaseType: release
  # Upload the generated latest.yml with the installer to the Sovara-versions release.
  # The application updater uses this metadata for verified NSIS downloads.
