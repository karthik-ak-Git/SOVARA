appId: com.sovara.desktop
productName: Sovara
copyright: Copyright © 2026 Sovara

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  # node-llama-cpp prebuilt binaries — bundled like Ollama, no Toolkit needed at runtime
  - from: node_modules/node-llama-cpp/llama
    to: llama
    filter:
      - localBuilds/**/*
      - dist/**/*
  - from: node_modules/node-llama-cpp/bins
    to: bins
  # node-pty Electron-ABI binaries (ConPTY) — vendored: upstream publishes no
  # Electron prebuilds for v35, so build/Release holds locally built binaries.
  # ptyHost loads these from <resources>/pty when node_modules is unavailable.
  - from: resources/pty
    to: pty

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  publisherName: Sovara
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sovara

publish: null
